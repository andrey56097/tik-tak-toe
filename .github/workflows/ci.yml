name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One in-flight run per ref. Superseded PR runs are cancelled; runs on main are
# not, so every commit that lands keeps its own verdict.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The job id is the branch-protection context name. Renaming it silently
  # breaks the merge gate — see docs/milestone-8-ci-plan.md.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      # The manifests are configuration, so nothing in the Gradle build touches
      # them and no unit test can. This is their check, and it runs before the
      # long one: it costs seconds, and a broken manifest should not wait fifteen
      # minutes behind the test suite to say so.
      #
      # Two commands, because they catch different things. `kubectl kustomize`
      # resolves k8s/ exactly as `apply -k` does, so a missing file or a bad
      # kustomization fails here. kubeconform then validates every resulting
      # resource against the Kubernetes API schema — the misspelled field that
      # YAML is happy with and the API server is not.
      #
      # kubeconform runs from its published image rather than a downloaded
      # binary: the runner already has Docker, and an image tag pins the version
      # without a checksum to maintain. `kubectl apply --dry-run=client` was the
      # obvious alternative and does not work here — it downloads the OpenAPI
      # schema from a live API server, so with no cluster it fails with
      # "connection refused" rather than validating anything.
      #
      # A step in this job rather than a job of its own: the job id `build` is
      # the branch-protection context name, so a second job would gate nothing
      # until the protection rule was updated to require it too.
      - name: Validate the Kubernetes manifests
        # `shell: bash` is not cosmetic: a `run:` block without it is executed as
        # `bash -e {0}`, with no `pipefail`, so a pipeline's exit status is its
        # *last* command's alone. kustomize failing to render would then be
        # printed to stderr and passed over, kubeconform would cheerfully report
        # "0 resources, 0 invalid", and the step would go green on a manifest set
        # that `kubectl apply -k` cannot even build. `shell: bash` adds
        # `-o pipefail`, which is what makes the first half of this gate real.
        shell: bash
        run: |
          kubectl kustomize k8s/ \
            | docker run --rm -i ghcr.io/yannh/kubeconform:v0.7.0 -strict -summary

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # The ui-service module's `check` runs a Vitest suite over the static page
      # (Milestone 10). It is a test-only toolchain — nothing here is shipped, and
      # the served page still has no build step — but the runner needs Node for the
      # Gradle build to reach it. `npm ci` itself is driven by the :ui-service:npmCi
      # task from the lockfile, so nothing installs packages twice.
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui-service/package-lock.json

      # `build` implies `check`; `check` depends on `pitest` in both the engine
      # and the session module, and on `jacocoTestCoverageVerification` in the
      # engine. One command is the whole gate: compile, test, coverage floor,
      # mutation floor, package. `--continue` so one broken module does not hide
      # the state of the other five.
      - name: Build, test and verify every module
        run: ./gradlew build --continue --console=plain --stacktrace

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          # run_id is stable across re-runs, and the upload refuses a duplicate
          # name — without overwrite, re-running a red build loses its reports.
          name: reports-${{ github.run_id }}
          overwrite: true
          path: |
            **/build/reports/tests/test
            **/build/reports/jacoco
            **/build/reports/pitest
            **/build/test-results/test
          retention-days: 7
          if-no-files-found: ignore
