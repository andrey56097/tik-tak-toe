# Shared by every Spring context started in this source set — the Session context
# under test and the embedded Engine instances alike. It holds only what both
# genuinely share; everything context-specific is set per context (Session via
# @SpringBootTest/@DynamicPropertySource, Engine via its own programmatic startup).
#
# Deliberately named .properties, not .yml. This service's own
# src/main/resources/application.yml already sits at classpath:/application.yml,
# and Spring Boot resolves that location to exactly ONE resource — the first on the
# classpath. An application.yml here would come first (a source set's own resources
# precede everything else) and would therefore shadow this service's own
# configuration, taking engine.client.base-url, engine.client.*-timeout-ms and
# session.stream.timeout-ms with it. A differently-named file is loaded alongside
# the .yml instead of replacing it.
#
# The same one-resource rule is what decides the collision with the Engine module's
# application.yml: this service's main output precedes project dependencies on the
# integrationTest runtime classpath, so the Session configuration wins and the
# Engine's file is never read. That is why the embedded Engine instances must be
# given their name, port and datasource explicitly rather than inheriting them.

# No Eureka in tests: discovery is satisfied from properties instead, so nothing
# here needs a registry to be running.
eureka.client.enabled=false
