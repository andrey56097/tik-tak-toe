# The orchestrator: creates games in the engine, drives the auto-play loop, and
# streams state to the browser over SSE.
#
# See eureka-server.yaml for why the probes, resources and securityContext look
# the way they do, and game-engine-service.yaml for why nothing sequences this
# Pod after the registry.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: game-session-service
spec:
  # One replica, and this is the constraint worth knowing about: sessions live in
  # an in-memory SessionStore, so a rolling update or an evicted Pod drops every
  # game in flight, and a second replica would serve half the polls from a Pod
  # that has never heard of the session. The seam for fixing that is the
  # SessionStore interface, not this field.
  replicas: 1
  selector:
    matchLabels:
      app: game-session-service
  template:
    metadata:
      labels:
        app: game-session-service
    spec:
      containers:
        - name: game-session-service
          image: tiktaktoe/game-session-service:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8082
          envFrom:
            - configMapRef:
                name: eureka-client
          env:
            - name: SERVER_PORT
              value: "8082"
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 2
            failureThreshold: 45
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            # Above the 1s default: this node runs five JVMs on two CPUs, each
            # capped at one, so CFS throttling can stall a cheap in-memory read
            # for longer than a second. A restart is an expensive answer to a
            # scheduling hiccup.
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 768Mi
              cpu: "1"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            runAsNonRoot: true
            runAsUser: 10001
---
apiVersion: v1
kind: Service
metadata:
  name: game-session-service
spec:
  selector:
    app: game-session-service
  ports:
    - name: http
      port: 8082
      targetPort: http
